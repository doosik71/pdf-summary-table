<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Summary</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>PDF Summary</h1>
        <p>Upload a PDF to get a summary.</p>
        <div class="upload-section">
            <div class="input-controls-wrapper">
                <div class="file-input-wrapper">
                    <label for="pdf-upload">PDF:</label>
                    <input type="file" id="pdf-upload" accept=".pdf">
                </div>
                <div class="url-input-wrapper">
                    <label for="pdf-url-input">PDF URL:</label>
                    <input type="text" id="pdf-url-input"
                        placeholder="Enter PDF URL (e.g., https://example.com/document.pdf)">
                </div>
            </div>
            <div class="prompt-section">
                <label for="prompt-select">Prompt:</label>
                <select id="prompt-select">
                    <option value="custom">Enter custom prompt</option>
                </select>
                <textarea id="custom-prompt" placeholder="Enter your custom prompt here..."></textarea>
            </div>
            <div class="button-container">
                <button id="summarize-btn">Summarize</button>
            </div>
        </div>
        <div class="summary-section">
            <div id="summary-output">
                <p>The summary will appear here.</p>
            </div>
            <div class="copy-buttons-container">
                <button id="copy-rich-text-btn">Copy Rich Text</button>
                <button id="copy-html-btn">Copy HTML</button>
                <button id="copy-markdown-btn">Copy Markdown</button>
            </div>
            <div id="loading-animation">
                <div class="spinner"></div>
                <p>Waiting for summary...</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- MathJax Configuration -->
    <script>
        MathJax = {
            options: {
                enableAssistiveMml: true,
                menuOptions: {
                    settings: {
                        renderer: 'CHTML'
                    }
                }
            },
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            },
            startup: {
                ready() {
                    MathJax.startup.defaultReady();

                    const addDataTex = () => {
                        const mathItems = MathJax.startup.document.getMathItemsWithin(document.body);
                        mathItems.forEach(item => {
                            if (item.typesetRoot && !item.typesetRoot.hasAttribute('data-tex')) {
                                item.typesetRoot.setAttribute('data-tex', item.math);
                                item.typesetRoot.setAttribute('data-display', item.display);
                            }
                        });
                    };

                    MathJax.startup.promise.then(addDataTex);
                    const originalTypesetPromise = MathJax.typesetPromise;
                    MathJax.typesetPromise = function (nodes) {
                        return originalTypesetPromise(nodes).then((result) => {
                            addDataTex();
                            return result;
                        });
                    };

                    document.addEventListener('copy', (event) => {
                        const selection = document.getSelection();
                        if (selection.isCollapsed) return;

                        const htmlContainer = document.createElement('div');
                        const textContainer = document.createElement('div');

                        for (let i = 0; i < selection.rangeCount; i++) {
                            const range = selection.getRangeAt(i);
                            htmlContainer.appendChild(range.cloneContents());
                            textContainer.appendChild(range.cloneContents());
                        }

                        const mathNodes = htmlContainer.querySelectorAll('mjx-container');
                        if (mathNodes.length > 0) {
                            mathNodes.forEach(node => {
                                const assistive = node.querySelector('mjx-assistive-mml');
                                const mml = node.getAttribute('data-mathml') || (assistive && assistive.innerHTML);
                                if (mml) {
                                    node.outerHTML = mml;
                                }
                            });

                            const textMathNodes = textContainer.querySelectorAll('mjx-container');
                            textMathNodes.forEach(node => {
                                const tex = node.getAttribute('data-tex');
                                const isDisplay = node.getAttribute('data-display') === 'true';
                                if (tex) {
                                    node.outerHTML = isDisplay ? `$$${tex}$$` : `$${tex}$`;
                                }
                            });

                            event.clipboardData.setData('text/html', htmlContainer.innerHTML);
                            event.clipboardData.setData('text/plain', textContainer.innerText);
                            event.preventDefault();

                            console.log(htmlContainer.innerHTML);
                        }
                    });
                }
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>

</html>
